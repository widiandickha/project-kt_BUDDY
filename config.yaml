# Konfigurasi tunggal Stress Buddy.
# Semua ambang batas, bobot, dan parameter berada di sini (aturan 0 spesifikasi).
# Isi awal mengikuti bagian 10 + Lampiran A.7; tambahan dicatat di docs/DECISIONS.md.

camera: {index: 0, width: 640, height: 480, fps: 30}

inference: {imgsz: 480, target_fps: 12, performance_mode: false, device: auto}

det: {model: models/best.pt, conf: 0.40, conf_eye: 0.50, iou: 0.5, grayscale: true}  # grayscale: D-013

pose: {model: models/yolov8n-pose.pt, min_kp_conf: 0.5, hand_face_ratio: 0.45, hand_min_frames: 5}

ear: {closed_threshold: 0.21, blink_min_ms: 80, microsleep_ms: 400, fusion_w_ear: 0.6, fusion_w_yolo: 0.4, fusion_threshold: 0.5}

# Landmark MediaPipe: sumber EAR utama + cadangan menguap/kerutan bila models/best.pt belum ada (D-016).
landmark: {model: models/face_landmarker.task, mar_yawn: 0.45, brow_drop: 0.10}

# Kalibrasi first-run (4.6): mata terbuka normal lalu pejam sebentar.
calibration: {total_sec: 20, closed_sec: 5, min_samples: 15, default_open_ear: 0.30, default_closed_ear: 0.12}

window: {short_sec: 60, long_sec: 1800, yawn_min_sec: 1.0, yawn_debounce_sec: 10}

score:
  weights: {perclos: 0.30, yawn: 0.20, furrow: 0.20, hand: 0.15, blink: 0.10, motion: 0.05}
  thresholds: {low: 35, high: 65}
  # Normalisasi indikator (tabel 4.5): nilai / pembagi, di-clamp 0..1.
  norm: {perclos: 0.30, yawn: 3, furrow: 0.40, hand: 4, blink: 15, motion: 0.05}
  blink_normal: [15, 20]    # kedipan per menit normal
  ema_alpha: 0.3
  up_hold_sec: 20
  down_hold_sec: 30
  down_margin: 5            # turun level butuh skor < ambang - margin
  min_window_sec: 20        # skor baru dihitung setelah jendela berisi data sekian detik

burnout: {ma_short_min: 30, ma_long_hours: 4, slope_min: 0.5, min_level: 55, min_duration_min: 120}

habit:
  work_break_min: 50
  away_min_sec: 300
  slouch_drop: 0.15
  too_close_ratio: 1.3
  low_blink: 8
  late_hour: 23
  away_after_sec: 10        # user_away bila tidak ada wajah/orang > 10 detik
  posture_hold_min: 3
  close_hold_min: 2
  blink_hold_min: 3
  good_break_max_min: 15
  long_work_min: 30         # "kerja panjang" untuk good_break
  great_hours: 2

buddy:
  scale: 1.0
  monitor: 0
  bubble_sec: 8
  cooldown_key_min: 15
  cooldown_global_min: 3
  max_per_hour: 8
  away_sleep_sec: 120
  fps_anim: 10
  # Lampiran A.7
  canvas_size: 512
  overlays_enabled: true
  anim_fps: 60
  idle_fps: 30
  # Tambahan FASE 5 (D-020 s.d. D-022)
  base_px: 160              # ukuran sprite di layar sebelum scale (spesifikasi 128..192)
  position: right           # right | center (tepi bawah layar, di atas taskbar)
  margin_px: 8
  calm_sec: 60              # stres rendah selama ini -> kembali IDLE
  sleepy_component: 0.5     # indikator PERCLOS/menguap ternormalisasi >= ini -> SLEEPY
  celebrate_breaks: 4       # jumlah good_break sehari untuk CELEBRATE
  snooze_min: 10            # tombol "Nanti"
  pause_min: 30             # menu "Jeda 30 menit"
  escalate_after: 2         # saran diabaikan sekian kali -> nada tegas
  max_chars: 90
  mask_hz: 10
  fullscreen_poll_sec: 2

storage: {db_path: data/stress_buddy.db, retention_days: 90, flush_sec: 10, log_every_sec: 10}

# Ringkasan harian (FASE 6, D-023): health_score = 100 - avg_stres*stress_weight - penalti + bonus.
health: {stress_weight: 0.5, no_break_penalty_per_hour: 5, posture_penalty_per_10min: 2, good_break_bonus: 3, max_bonus: 15}

privacy: {save_frames: false, show_camera_indicator: true}

# Tambahan (bagian 7 "level dari config"), lihat docs/DECISIONS.md D-004.
logging: {level: INFO, file: logs/app.log}

# FASE 2: dataset & anotasi (lihat docs/DECISIONS.md D-007 s.d. D-012).
dataset:
  raw_dir: data/raw
  out_dir: data/dataset
  data_yaml: data/data.yaml
  report: docs/dataset_report.md
  split: {train: 0.7, val: 0.2, test: 0.1, seed: 42}
  target_per_class: 500
  min_subjects: 5
  collect: {burst_interval_sec: 0.5, jpeg_quality: 95}
  import:
    # NTHU-DDD: frame berurutan dari video, jadi diambil merata per grup (subjek x kacamata x skenario).
    nthu_per_group: {normal: 40, mengantuk: 80, kedip_lambat: 80, menguap: 300}
    # Frame NTHU versi Kaggle memuat kotak berwarna tercetak; piksel berwarna di-inpaint (D-010).
    overlay_color_diff: 40
    overlay_dilate_px: 1
    uta_every_sec: 2.0
    uta_max_per_video: 150
  preannotate:
    landmarker: models/face_landmarker.task
    ear_closed: 0.18       # EAR < ini -> mata_tertutup
    ear_open: 0.24         # EAR > ini -> mata_terbuka; di antaranya ditandai "ragu" untuk dicek
    mar_yawn: 0.45         # MAR bibir dalam > ini -> menguap
    pad_eyes: 0.08         # padding tiap sisi box, relatif lebar wajah
    pad_mouth: 0.06
    pad_brow: 0.05
  augment: {copies: 1, brightness: 0.25, contrast: 0.25, blur_max_kernel: 5, rotate_deg: 10, hflip_p: 0.5, seed: 42}

# FASE 3: training YOLOv8 (hyperparameter awal spesifikasi; lihat docs/DECISIONS.md D-013 s.d. D-015).
train:
  base_model: yolov8n.pt        # naik ke yolov8s.pt bila mAP50 < target
  epochs: 100
  imgsz: 640
  batch: 16
  patience: 20
  augment: true
  workers: 4
  seed: 42
  project: runs/detect
  name: face
  target_map50: 0.80
  eval_dir: docs/eval
